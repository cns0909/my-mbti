
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 포켓몬 찾기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      font-family: "Malgun Gothic", sans-serif;
      background: #fff8e8;
      color: #55452e;
      text-align: center;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      padding: 30px 24px;
      background: #fffdf6;
      border: 3px solid #f3d58a;
      border-radius: 28px;
      box-shadow: 0 8px 20px #d9b96830;
    }

    h1 {
      margin: 5px 0 12px;
      font-size: 34px;
      color: #a66d17;
    }

    .subtitle {
      font-size: 17px;
      line-height: 1.8;
      color: #78684f;
      margin-bottom: 28px;
    }

    .sun {
      font-size: 48px;
      margin-bottom: 8px;
    }

    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 24px 0;
    }

    .mbti-btn {
      padding: 15px 4px;
      border: 2px solid #f0d69a;
      border-radius: 14px;
      background: #fff4cf;
      color: #77551d;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .mbti-btn:hover {
      background: #ffe49b;
      transform: translateY(-3px);
    }

    .mbti-btn:focus-visible,
    .again-btn:focus-visible {
      outline: 3px solid #a66d17;
      outline-offset: 3px;
    }

    .result {
      display: none;
      margin-top: 28px;
      padding: 25px 20px;
      border-radius: 22px;
      background: #fff2c9;
      border: 2px dashed #e8c16a;
      animation: appear 0.35s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-label {
      display: inline-block;
      padding: 7px 15px;
      border-radius: 20px;
      background: #f6d98b;
      font-size: 15px;
      font-weight: bold;
    }

    .pokemon-emoji {
      font-size: 100px;
      margin: 15px 0 5px;
      line-height: 1.4;
    }

    .pokemon-name {
      margin: 0;
      font-size: 32px;
      color: #a66d17;
    }

    .pokemon-desc {
      max-width: 550px;
      margin: 16px auto 24px;
      font-size: 17px;
      line-height: 1.9;
      word-break: keep-all;
    }

    .compatibility {
      margin-top: 20px;
      padding: 18px;
      background: #fffdf6;
      border-radius: 16px;
    }

    .compatibility h3 {
      margin: 0 0 10px;
      font-size: 19px;
      color: #a66d17;
    }

    .compatibility p {
      margin: 0;
      font-size: 17px;
      line-height: 1.7;
    }

    .again-btn {
      margin-top: 22px;
      padding: 13px 26px;
      border: none;
      border-radius: 25px;
      background: #dca83e;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .again-btn:hover {
      background: #bd8522;
      transform: scale(1.04);
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #a18e6d;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 27px;
      }

      .container {
        padding: 24px 14px;
      }

      .mbti-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 7px;
      }

      .mbti-btn {
        font-size: 15px;
        padding: 13px 2px;
      }

      .pokemon-emoji {
        font-size: 80px;
      }

      .pokemon-name {
        font-size: 27px;
      }

      .pokemon-desc {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="sun">☀️</div>

    <h1>MBTI로 포켓몬 찾기!</h1>

    <p class="subtitle">
      내 MBTI와 어울리는 포켓몬은 누구일까? 🐾<br>
      아래에서 내 MBTI를 선택해 봐!
    </p>

    <h2>✨ 나의 MBTI는?</h2>

    <div class="mbti-grid" id="mbtiGrid"></div>

    <section class="result" id="result" aria-live="polite">
      <span class="result-label" id="typeLabel"></span>

      <div class="pokemon-emoji" id="pokemonEmoji"></div>

      <h2 class="pokemon-name" id="pokemonName"></h2>

      <p class="pokemon-desc" id="pokemonDesc"></p>

      <div class="compatibility">
        <h3>💛 잘 맞는 MBTI</h3>
        <p id="compatibleType"></p>
      </div>

      <button class="again-btn" onclick="resetPage()">
        ↩ 다시 고르기
      </button>
    </section>

    <p class="footer">
      ※ 포켓몬과 MBTI의 조합은 재미를 위한 창작 콘텐츠입니다.
    </p>
  </main>

  <script>
    const pokemonData = {
      ISTJ: {
        pokemon: "잠만보",
        emoji: "😴",
        reason: "차분하고 신중한 ISTJ는 맡은 일을 꾸준히 해내는 타입!\n잠만보처럼 자기만의 페이스를 지키면서 믿음직한 모습을 보여 줘.",
        compatible: "ESFP · 밝은 에너지로 서로의 부족한 점을 채워 줘!"
      },

      ISFJ: {
        pokemon: "이브이",
        emoji: "🦊",
        reason: "다정하고 배려심이 많은 ISFJ는 주변 사람을 소중히 여겨.\n이브이처럼 따뜻한 매력과 다양한 가능성을 가지고 있어!",
        compatible: "ESFP · 서로에게 즐거움과 따뜻함을 전해 줘!"
      },

      INFJ: {
        pokemon: "가디",
        emoji: "🐕",
        reason: "INFJ는 다른 사람의 마음을 잘 헤아리고 깊이 생각하는 편이야.\n가디처럼 따뜻하고 충성심이 강한 모습이 잘 어울려!",
        compatible: "ENFP · 상상력과 진심 어린 대화가 잘 통할 수 있어."
      },

      INTJ: {
        pokemon: "뮤츠",
        emoji: "🧠",
        reason: "분석하고 계획하는 것을 좋아하는 INTJ!\n뮤츠처럼 뛰어난 지능과 독립적인 성향을 가진 포켓몬이 어울려.",
        compatible: "ENFP · 서로 다른 관점에서 새로운 아이디어를 얻을 수 있어."
      },

      ISTP: {
        pokemon: "루카리오",
        emoji: "🐺",
        reason: "ISTP는 직접 관찰하고 문제를 해결하는 데 강점이 있어.\n루카리오처럼 침착하게 상황을 파악하고 행동하는 모습이 닮았어!",
        compatible: "ESFJ · 실용적인 생각과 따뜻한 배려가 만날 수 있어."
      },

      ISFP: {
        pokemon: "치코리타",
        emoji: "🌱",
        reason: "ISFP는 자기만의 감성과 부드러운 매력을 가진 타입!\n치코리타처럼 온화하고 자연을 사랑하는 분위기가 잘 어울려.",
        compatible: "ENFJ · 서로의 감정을 이해하고 장점을 응원해 줄 수 있어."
      },

      INFP: {
        pokemon: "피카츄",
        emoji: "⚡",
        reason: "INFP는 소중한 가치와 진심을 중요하게 생각해.\n피카츄처럼 마음을 나누는 친구에게 애정을 표현하는 모습이 어울려!",
        compatible: "ENFJ · 서로의 마음을 이해하고 꿈을 응원해 줄 수 있어."
      },

      INTP: {
        pokemon: "메타몽",
        emoji: "🟣",
        reason: "호기심이 많고 독특한 생각을 즐기는 INTP!\n메타몽처럼 다양한 가능성을 탐색하고 새로운 방식으로 생각하는 타입이야.",
        compatible: "ENTJ · 아이디어를 실제 계획으로 발전시키는 데 도움을 줄 수 있어."
      },

      ESTP: {
        pokemon: "리자몽",
        emoji: "🔥",
        reason: "ESTP는 활동적이고 새로운 경험을 즐기는 편이야.\n리자몽처럼 자신감 있게 도전하고 에너지를 발산하는 모습이 닮았어!",
        compatible: "ISFJ · 서로 다른 장점으로 균형을 맞출 수 있어."
      },

      ESFP: {
        pokemon: "피카츄",
        emoji: "⚡",
        reason: "밝고 활발한 ESFP는 사람들과 함께하는 순간을 즐겨!\n피카츄처럼 생기 넘치는 에너지로 주변을 즐겁게 만들어 줘.",
        compatible: "ISFJ · 밝은 에너지와 다정함이 좋은 조화를 이룰 수 있어."
      },

      ENFP: {
        pokemon: "토게피",
        emoji: "🥚",
        reason: "ENFP는 호기심이 많고 새로운 가능성을 발견하는 걸 좋아해.\n토게피처럼 사랑스럽고 긍정적인 분위기로 주변에 즐거움을 줘!",
        compatible: "INFJ · 깊은 대화와 새로운 생각을 함께 나눌 수 있어."
      },

      ENTP: {
        pokemon: "팬텀",
        emoji: "👻",
        reason: "ENTP는 재치 있고 독창적인 아이디어를 떠올리는 것을 좋아해.\n팬텀처럼 장난기와 예상 밖의 매력으로 분위기를 바꿔 놓아!",
        compatible: "INFJ · 서로의 생각을 자극하며 새로운 관점을 얻을 수 있어."
      },

      ESTJ: {
        pokemon: "괴력몬",
        emoji: "💪",
        reason: "ESTJ는 목표를 정하고 일을 체계적으로 진행하는 편이야.\n괴력몬처럼 책임감을 가지고 맡은 일을 힘차게 해내는 모습이 어울려!",
        compatible: "ISFP · 계획성과 유연함이 서로에게 좋은 영향을 줄 수 있어."
      },

      ESFJ: {
        pokemon: "푸린",
        emoji: "🎤",
        reason: "ESFJ는 사람들과 어울리고 주변을 챙기는 것을 좋아해.\n푸린처럼 노래와 다정한 매력으로 사람들에게 즐거움을 줄 수 있어!",
        compatible: "ISFP · 서로를 배려하면서 편안한 관계를 만들 수 있어."
      },

      ENFJ: {
        pokemon: "님피아",
        emoji: "🎀",
        reason: "ENFJ는 다른 사람을 격려하고 함께 성장하는 데 관심이 많아.\n님피아처럼 다정하고 마음을 이어 주는 매력이 잘 어울려!",
        compatible: "INFP · 서로의 감정을 존중하며 꿈을 응원할 수 있어."
      },

      ENTJ: {
        pokemon: "보만다",
        emoji: "🐉",
        reason: "ENTJ는 큰 목표를 세우고 적극적으로 도전하는 타입!\n보만다처럼 넓은 시야와 강한 추진력으로 앞으로 나아가는 모습이 닮았어.",
        compatible: "INTP · 전략과 창의적인 아이디어를 함께 발전시킬 수 있어."
      }
    };

    const mbtiTypes = [
      "ISTJ", "ISFJ", "INFJ", "INTJ",
      "ISTP", "ISFP", "INFP", "INTP",
      "ESTP", "ESFP", "ENFP", "ENTP",
      "ESTJ", "ESFJ", "ENFJ", "ENTJ"
    ];

    const grid = document.getElementById("mbtiGrid");

    // 16가지 MBTI 버튼 만들기
    mbtiTypes.forEach(function(type) {
      const button = document.createElement("button");

      button.className = "mbti-btn";
      button.textContent = type;
      button.type = "button";

      button.addEventListener("click", function() {
        showResult(type);
      });

      grid.appendChild(button);
    });

    // 선택한 MBTI의 포켓몬 보여 주기
    function showResult(type) {
      const data = pokemonData[type];

      document.getElementById("typeLabel").textContent =
        "나의 MBTI: " + type;

      document.getElementById("pokemonEmoji").textContent =
        data.emoji;

      document.getElementById("pokemonName").textContent =
        data.pokemon;

      document.getElementById("pokemonDesc").textContent =
        data.reason;

      document.getElementById("compatibleType").textContent =
        data.compatible;

      document.getElementById("result").style.display = "block";

      // 결과가 화면에 잘 보이도록 이동
      document.getElementById("result").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    // 처음 화면으로 돌아가기
    function resetPage() {
      document.getElementById("result").style.display = "none";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }
  </script>
</body>
</html>
