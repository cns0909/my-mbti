
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 포켓몬 찾기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      background: #fff8e9;
      color: #59472e;
      font-family: "Malgun Gothic", sans-serif;
      text-align: center;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 30px 24px;
      background: #fffdf7;
      border: 3px solid #f2d68e;
      border-radius: 28px;
      box-shadow: 0 8px 24px #c9a75b25;
    }

    .sun {
      font-size: 48px;
    }

    h1 {
      color: #a56d18;
      font-size: 34px;
      margin: 12px 0;
    }

    .subtitle {
      font-size: 17px;
      line-height: 1.8;
      margin-bottom: 28px;
    }

    h2 {
      font-size: 23px;
    }

    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 24px 0;
    }

    .mbti-btn {
      padding: 15px 4px;
      background: #fff1c9;
      border: 2px solid #f0d393;
      border-radius: 14px;
      color: #77541e;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .mbti-btn:hover {
      background: #ffdf91;
      transform: translateY(-3px);
    }

    button:focus-visible {
      outline: 3px solid #a56d18;
      outline-offset: 3px;
    }

    .result {
      display: none;
      margin-top: 28px;
      padding: 24px 18px;
      background: #fff2cb;
      border: 2px dashed #e5c16c;
      border-radius: 22px;
    }

    .type-label {
      display: inline-block;
      padding: 8px 16px;
      background: #f5d98e;
      border-radius: 20px;
      font-weight: bold;
    }

    .pokemon-emoji {
      font-size: 100px;
      line-height: 1.5;
      margin-top: 12px;
    }

    .pokemon-name {
      color: #a56d18;
      font-size: 32px;
      margin: 4px 0 12px;
    }

    .pokemon-desc {
      max-width: 560px;
      margin: 12px auto 24px;
      font-size: 17px;
      line-height: 1.9;
      white-space: pre-line;
      word-break: keep-all;
    }

    .compatibility {
      padding: 18px;
      background: #fffdf7;
      border-radius: 16px;
      line-height: 1.8;
    }

    .compatibility h3 {
      margin: 0 0 8px;
      color: #a56d18;
      font-size: 20px;
    }

    .compatibility p {
      margin: 0;
      font-size: 16px;
    }

    .again-btn {
      margin-top: 22px;
      padding: 13px 25px;
      border: none;
      border-radius: 25px;
      background: #dca83e;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .again-btn:hover {
      background: #bd8522;
    }

    .footer {
      margin-top: 24px;
      color: #9b896c;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      .container {
        padding: 24px 14px;
      }

      h1 {
        font-size: 27px;
      }

      .mbti-grid {
        gap: 7px;
      }

      .mbti-btn {
        padding: 13px 2px;
        font-size: 15px;
      }

      .pokemon-emoji {
        font-size: 80px;
      }

      .pokemon-name {
        font-size: 27px;
      }

      .pokemon-desc {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="sun">☀️</div>

    <h1>MBTI로 포켓몬 찾기!</h1>

    <p class="subtitle">
      내 성격과 닮은 포켓몬은 누구일까? 🐾<br>
      MBTI를 선택하고 나만의 포켓몬을 찾아 봐!
    </p>

    <h2>✨ 나의 MBTI는?</h2>

    <div class="mbti-grid" id="mbtiGrid"></div>

    <section class="result" id="result" aria-live="polite">
      <span class="type-label" id="typeLabel"></span>

      <div class="pokemon-emoji" id="pokemonEmoji"></div>

      <h2 class="pokemon-name" id="pokemonName"></h2>

      <p class="pokemon-desc" id="pokemonDesc"></p>

      <div class="compatibility">
        <h3>💛 잘 맞는 MBTI</h3>
        <p id="compatibleType"></p>
      </div>

      <button class="again-btn" onclick="resetPage()">
        ↩ 다시 고르기
      </button>
    </section>

    <p class="footer">
      포켓몬과 MBTI의 조합은 재미를 위해 만든 콘텐츠입니다.
    </p>
  </main>

  <script>
    const pokemonData = {
      ISTJ: {
        pokemon: "거북왕",
        emoji: "🐢",
        reason: "ISTJ는 책임감이 강하고 차근차근 목표를 이루는 타입이야.\n거북왕처럼 든든하고 침착하게 자기 역할을 해내는 모습이 잘 어울려!",
        compatible: "ESFP · 서로 다른 매력으로 일상에 활기를 더할 수 있어."
      },

      ISFJ: {
        pokemon: "해피너스",
        emoji: "💗",
        reason: "ISFJ는 주변 사람을 세심하게 살피고 배려하는 편이야.\n해피너스처럼 다정한 마음으로 다른 사람에게 힘이 되어 주는 모습이 닮았어!",
        compatible: "ESFP · 따뜻한 배려와 밝은 에너지가 조화를 이룰 수 있어."
      },

      INFJ: {
        pokemon: "루기아",
        emoji: "🪽",
        reason: "INFJ는 깊이 생각하고 자신이 중요하게 여기는 가치를 지키려 해.\n루기아처럼 차분하고 신비로우면서도 다른 존재를 보호하는 이미지가 어울려!",
        compatible: "ENFP · 깊은 생각과 새로운 아이디어를 함께 나눌 수 있어."
      },

      INTJ: {
        pokemon: "디아루가",
        emoji: "⏳",
        reason: "INTJ는 장기적인 목표를 세우고 전략적으로 생각하는 편이야.\n시간을 다루는 디아루가처럼 계획을 세우고 미래를 내다보는 이미지가 잘 어울려!",
        compatible: "ENTP · 서로의 생각을 발전시키며 새로운 가능성을 찾을 수 있어."
      },

      ISTP: {
        pokemon: "핫삼",
        emoji: "🦀",
        reason: "ISTP는 복잡한 상황에서도 실용적인 해결 방법을 찾는 타입이야.\n핫삼처럼 군더더기 없이 빠르고 정확하게 행동하는 모습이 닮았어!",
        compatible: "ESTJ · 실행력과 체계적인 계획을 서로에게 배울 수 있어."
      },

      ISFP: {
        pokemon: "마릴",
        emoji: "💧",
        reason: "ISFP는 부드럽고 자유로운 분위기와 자기만의 감성을 중요하게 생각해.\n마릴처럼 귀엽고 편안한 매력으로 주변에 포근한 느낌을 주는 모습이 어울려!",
        compatible: "ENFJ · 서로의 감정을 존중하고 장점을 응원해 줄 수 있어."
      },

      INFP: {
        pokemon: "세레비",
        emoji: "🌿",
        reason: "INFP는 상상력이 풍부하고 자신만의 소중한 가치를 중요하게 여겨.\n세레비처럼 자연을 아끼고 희망적인 분위기를 가진 포켓몬이 잘 어울려!",
        compatible: "ENFJ · 서로의 꿈을 격려하고 마음을 이해할 수 있어."
      },

      INTP: {
        pokemon: "폴리곤",
        emoji: "💻",
        reason: "INTP는 새로운 원리와 지식을 탐구하는 것을 좋아해.\n폴리곤처럼 독특하고 기술적인 이미지를 가진 포켓몬이 잘 어울려!",
        compatible: "ENTJ · 분석적인 아이디어를 구체적인 계획으로 발전시킬 수 있어."
      },

      ESTP: {
        pokemon: "갸라도스",
        emoji: "🌊",
        reason: "ESTP는 과감하게 도전하고 눈앞의 상황에 빠르게 대응하는 편이야.\n갸라도스처럼 강한 에너지와 대담한 이미지가 잘 어울려!",
        compatible: "ISFJ · 서로에게 부족한 점을 보완하며 배울 수 있어."
      },

      ESFP: {
        pokemon: "루차불",
        emoji: "🎭",
        reason: "ESFP는 활기차고 사람들의 관심을 즐기는 타입이야.\n루차불처럼 화려한 매력과 넘치는 에너지로 분위기를 즐겁게 만들어 줘!",
        compatible: "ISFJ · 밝은 에너지와 세심한 배려가 좋은 조화를 이룰 수 있어."
      },

      ENFP: {
        pokemon: "파치리스",
        emoji: "🐿️",
        reason: "ENFP는 호기심이 많고 새로운 경험을 즐기는 편이야.\n파치리스처럼 통통 튀는 에너지와 사랑스러운 매력으로 주변에 활기를 줘!",
        compatible: "INFJ · 새로운 아이디어와 깊은 대화를 함께 즐길 수 있어."
      },

      ENTP: {
        pokemon: "조로아크",
        emoji: "🦊",
        reason: "ENTP는 독창적인 발상과 재치 있는 문제 해결을 즐겨.\n조로아크처럼 변화무쌍하고 영리한 이미지가 ENTP의 창의적인 면과 잘 어울려!",
        compatible: "INTJ · 서로의 전략과 아이디어를 발전시킬 수 있어."
      },

      ESTJ: {
        pokemon: "엠페르트",
        emoji: "👑",
        reason: "ESTJ는 목표를 분명히 하고 책임감 있게 일을 이끄는 편이야.\n엠페르트처럼 당당하고 원칙을 중시하는 이미지가 잘 어울려!",
        compatible: "ISTP · 계획을 세우는 능력과 실전 대처 능력이 서로에게 도움이 될 수 있어."
      },

      ESFJ: {
        pokemon: "이어롭",
        emoji: "🐰",
        reason: "ESFJ는 사람들과 잘 어울리고 주변을 챙기는 것을 중요하게 생각해.\n이어롭처럼 친근하고 다정하면서도 자신만의 매력을 가진 모습이 어울려!",
        compatible: "ISFP · 서로를 배려하며 편안한 관계를 만들어 갈 수 있어."
      },

      ENFJ: {
        pokemon: "메가니움",
        emoji: "🌸",
        reason: "ENFJ는 사람들을 격려하고 함께 성장하는 데 관심이 많아.\n메가니움처럼 온화한 분위기로 주변에 편안함과 긍정적인 기운을 줄 수 있어!",
        compatible: "INFP · 서로의 감정을 존중하고 꿈을 응원할 수 있어."
      },

      ENTJ: {
        pokemon: "레쿠쟈",
        emoji: "🐉",
        reason: "ENTJ는 큰 목표를 세우고 적극적으로 앞으로 나아가는 타입이야.\n레쿠쟈처럼 강렬한 존재감과 압도적인 카리스마를 가진 모습이 잘 어울려!",
        compatible: "INTP · 전략적인 추진력과 창의적인 분석이 서로를 보완할 수 있어."
      }
    };

    const mbtiTypes = [
      "ISTJ", "ISFJ", "INFJ", "INTJ",
      "ISTP", "ISFP", "INFP", "INTP",
      "ESTP", "ESFP", "ENFP", "ENTP",
      "ESTJ", "ESFJ", "ENFJ", "ENTJ"
    ];

    const grid = document.getElementById("mbtiGrid");

    // 16가지 MBTI 버튼 생성
    mbtiTypes.forEach(function(type) {
      const button = document.createElement("button");

      button.type = "button";
      button.className = "mbti-btn";
      button.textContent = type;

      button.addEventListener("click", function() {
        showResult(type);
      });

      grid.appendChild(button);
    });

    // 선택한 유형의 결과 표시
    function showResult(type) {
      const data = pokemonData[type];

      document.getElementById("typeLabel").textContent =
        "나의 MBTI: " + type;

      document.getElementById("pokemonEmoji").textContent =
        data.emoji;

      document.getElementById("pokemonName").textContent =
        data.pokemon;

      document.getElementById("pokemonDesc").textContent =
        data.reason;

      document.getElementById("compatibleType").textContent =
        data.compatible;

      document.getElementById("result").style.display = "block";

      document.getElementById("result").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    // 결과를 숨기고 다시 선택하기
    function resetPage() {
      document.getElementById("result").style.display = "none";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }
  </script>
</body>
</html>
