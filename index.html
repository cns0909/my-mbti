
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포켓몬 MBTI 도감</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --ink: #383650;
  --purple: #8277d9;
  --pink: #ffb9ce;
  --blue: #c6e8ff;
  --paper: #ffffff;
}

body {
  margin: 0;
  padding: 28px 16px 45px;
  font-family: "Malgun Gothic", sans-serif;
  color: var(--ink);
  background-color: #eeeaff;
  background-image: radial-gradient(#d5cdfb 1.5px, transparent 1.5px);
  background-size: 22px 22px;
}

.container {
  max-width: 860px;
  margin: 0 auto;
}

.top-card {
  position: relative;
  overflow: hidden;
  padding: 34px 20px 30px;
  text-align: center;
  background: white;
  border: 3px solid var(--ink);
  border-radius: 30px;
  box-shadow: 7px 7px 0 var(--ink);
}

.top-card::before,
.top-card::after {
  content: "✦";
  position: absolute;
  color: #ff9fbd;
  font-size: 38px;
}

.top-card::before {
  top: 20px;
  left: 24px;
}

.top-card::after {
  right: 25px;
  bottom: 20px;
}

.mini-label {
  display: inline-block;
  padding: 7px 13px;
  background: #e6e0ff;
  border: 2px solid var(--ink);
  border-radius: 30px;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
}

h1 {
  margin: 18px 0 10px;
  font-size: clamp(27px, 5vw, 42px);
  letter-spacing: -1px;
}

.title-highlight {
  color: #8070d8;
}

.intro {
  margin: 0;
  font-size: 15px;
  line-height: 1.8;
  color: #77748f;
}

.hero-pokemon {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  margin: 24px auto 0;
}

.hero-ball {
  display: grid;
  place-items: center;
  width: 82px;
  height: 82px;
  border: 3px solid var(--ink);
  border-radius: 25px;
  font-size: 44px;
  transform: rotate(-7deg);
}

.hero-ball:nth-child(1) {
  background: #ffe0eb;
}

.hero-ball:nth-child(2) {
  background: #d9f2ff;
  transform: rotate(5deg) translateY(-9px);
}

.hero-ball:nth-child(3) {
  background: #e4e0ff;
  transform: rotate(-4deg);
}

.select-card {
  margin-top: 28px;
  padding: 26px 22px;
  background: #fff;
  border: 3px solid var(--ink);
  border-radius: 26px;
  box-shadow: 6px 6px 0 var(--ink);
}

.section-heading {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 7px;
  font-size: 22px;
}

.section-heading span {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  background: #ffdfeb;
  border-radius: 12px;
}

.section-desc {
  margin: 0 0 22px;
  color: #85819b;
  font-size: 14px;
}

.mbti-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.mbti-btn {
  min-height: 65px;
  padding: 12px 3px;
  border: 2px solid var(--ink);
  border-radius: 17px;
  background: #f0edff;
  color: var(--ink);
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 0 var(--ink);
  transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
}

.mbti-btn:nth-child(4n+2) {
  background: #e0f4ff;
}

.mbti-btn:nth-child(4n+3) {
  background: #ffe8f0;
}

.mbti-btn:nth-child(4n) {
  background: #fff0cf;
}

.mbti-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 7px 0 var(--ink);
}

.mbti-btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--ink);
}

button:focus-visible {
  outline: 3px solid #8c72ff;
  outline-offset: 4px;
}

.result {
  display: none;
  margin-top: 30px;
  animation: popIn 0.35s ease;
}

@keyframes popIn {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.result-card {
  overflow: hidden;
  border: 3px solid var(--ink);
  border-radius: 28px;
  background: white;
  box-shadow: 7px 7px 0 var(--ink);
}

.result-top {
  padding: 28px 18px 22px;
  background: #e1ddff;
  border-bottom: 3px solid var(--ink);
}

.result-tag {
  display: inline-block;
  padding: 7px 14px;
  border: 2px solid var(--ink);
  border-radius: 30px;
  background: white;
  font-size: 14px;
  font-weight: bold;
}

.pokemon-stage {
  display: grid;
  place-items: center;
  width: 175px;
  height: 175px;
  margin: 20px auto 15px;
  border: 3px solid var(--ink);
  border-radius: 50%;
  background: #fff;
  box-shadow: 5px 5px 0 #b8aef3;
}

.pokemon-emoji {
  font-size: 94px;
  line-height: 1;
}

.pokemon-name {
  margin: 8px 0;
  font-size: 34px;
}

.pokemon-subtitle {
  margin: 0;
  font-size: 14px;
  color: #716b94;
}

.result-content {
  padding: 25px 22px;
}

.info-box {
  padding: 19px;
  margin-bottom: 14px;
  text-align: left;
  border: 2px solid var(--ink);
  border-radius: 19px;
  background: #fff8e7;
}

.info-box.compat {
  background: #e8f6ff;
  margin-bottom: 0;
}

.info-title {
  margin: 0 0 10px;
  font-size: 17px;
}

.info-text {
  margin: 0;
  font-size: 15px;
  line-height: 1.9;
  white-space: pre-line;
  word-break: keep-all;
}

.compat-type {
  display: inline-block;
  margin: 0 0 8px;
  padding: 6px 12px;
  background: white;
  border: 2px solid var(--ink);
  border-radius: 12px;
  font-weight: bold;
}

.again-btn {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  border: 3px solid var(--ink);
  border-radius: 17px;
  background: #ffcada;
  color: var(--ink);
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 0 var(--ink);
  transition: 0.15s;
}

.again-btn:hover {
  background: #ffb3cb;
  transform: translateY(-2px);
}

.footer {
  margin-top: 27px;
  text-align: center;
  color: #7e789c;
  font-size: 12px;
  line-height: 1.8;
}

@media (max-width: 500px) {
  body {
    padding: 18px 12px 35px;
  }

  .top-card {
    padding: 30px 13px 25px;
    box-shadow: 5px 5px 0 var(--ink);
  }

  .top-card::before {
    left: 12px;
    top: 12px;
  }

  .top-card::after {
    right: 12px;
    bottom: 10px;
  }

  .hero-ball {
    width: 65px;
    height: 65px;
    font-size: 34px;
    border-radius: 20px;
  }

  .select-card {
    padding: 22px 14px;
    box-shadow: 4px 4px 0 var(--ink);
  }

  .mbti-grid {
    gap: 9px;
  }

  .mbti-btn {
    min-height: 57px;
    font-size: 15px;
    border-radius: 13px;
  }

  .pokemon-stage {
    width: 145px;
    height: 145px;
  }

  .pokemon-emoji {
    font-size: 78px;
  }

  .pokemon-name {
    font-size: 29px;
  }

  .result-content {
    padding: 19px 14px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>
<main class="container">

  <header class="top-card">
    <span class="mini-label">POKÉMON PERSONALITY LAB</span>

    <h1>
      나와 닮은<br>
      <span class="title-highlight">포켓몬 찾기!</span>
    </h1>

    <p class="intro">
      MBTI를 선택하면 나와 어울리는 포켓몬이 나타나!<br>
      과연 너와 닮은 포켓몬은 누구일까? ✨
    </p>

    <div class="hero-pokemon" aria-hidden="true">
      <div class="hero-ball">⚡</div>
      <div class="hero-ball">🌸</div>
      <div class="hero-ball">💧</div>
    </div>
  </header>

  <section class="select-card">
    <h2 class="section-heading">
      <span>🎀</span>
      MBTI 선택하기
    </h2>

    <p class="section-desc">
      내 성격 유형을 눌러서 결과를 확인해 봐!
    </p>

    <div class="mbti-grid" id="mbtiGrid"></div>
  </section>

  <section class="result" id="result" aria-live="polite">
    <div class="result-card">

      <div class="result-top">
        <span class="result-tag" id="typeLabel"></span>

        <div class="pokemon-stage">
          <div class="pokemon-emoji" id="pokemonEmoji"></div>
        </div>

        <h2 class="pokemon-name" id="pokemonName"></h2>

        <p class="pokemon-subtitle">
          ✦ 너와 닮은 포켓몬을 발견했어! ✦
        </p>
      </div>

      <div class="result-content">
        <div class="info-box">
          <h3 class="info-title">💜 너와 닮은 이유</h3>
          <p class="info-text" id="pokemonDesc"></p>
        </div>

        <div class="info-box compat">
          <h3 class="info-title">💌 찰떡 궁합 MBTI</h3>
          <div class="compat-type" id="compatibleType"></div>
          <p class="info-text" id="compatibleDesc"></p>
        </div>

        <button class="again-btn" onclick="resetPage()">
          ↩ 다른 포켓몬 찾아보기
        </button>
      </div>
    </div>
  </section>

  <footer class="footer">
    포켓몬 MBTI 도감 · 나만의 포켓몬을 찾아봐!<br>
    ※ 포켓몬과 MBTI의 조합은 재미를 위한 창작 콘텐츠입니다.
  </footer>

</main>

<script>
const pokemonData = {
  ISTJ: {
    pokemon: "거북왕",
    emoji: "🐢",
    reason: "책임감이 강하고 차근차근 목표를 이루는 ISTJ!\n거북왕처럼 든든하고 침착하게 자기 역할을 해내는 모습이 잘 어울려.",
    compatible: "ESFP",
    compatibleDesc: "서로 다른 매력으로 일상에 활기를 더하고 새로운 경험을 함께 즐길 수 있어."
  },

  ISFJ: {
    pokemon: "해피너스",

    compatible: "ESFP",
    compatibleDesc: "따뜻한 배려와 밝은 에너지가 만나 즐겁고 편안한 관계를 만들 수 있어."
  },

    compatible: "ENFP",
    compatibleDesc: "깊은 생각과 새로운 아이디어를 함께 나누며 서로의 시야를 넓힐 수 있어."
  },

  INTJ: {
    pokemon: "디아루가",
    emoji: "⏳",
    reason: "장기적인 목표를 세우고 전략적으로 생각하는 INTJ!\n시간을 다루는 디아루가처럼 계획을 세우고 미래를 내다보는 이미지가 잘 어울려.",
    compatible: "ENTP",
    compatibleDesc: "서로의 독창적인 생각을 발전시키며 새로운 가능성을 찾을 수 있어."
  },

  ISTP: {
    pokemon: "핫삼",
    emoji: "🦀",
    reason: "복잡한 상황에서도 실용적인 해결 방법을 찾는 ISTP!\n핫삼처럼 침착하고 정확하게 행동하며 문제를 해결하는 모습이 닮았어.",
    compatible: "ESTJ",
    compatibleDesc: "실전 대처 능력과 체계적인 계획을 서로에게 배울 수 있어."
  },

  ISFP: {
    pokemon: "마릴",
    emoji: "💧",
    reason: "자유로운 분위기와 자기만의 감성을 중요하게 생각하는 ISFP!\n마릴처럼 귀엽고 편안한 매력으로 주변에 포근한 느낌을 주는 모습이 어울려.",
    compatible: "ENFJ",
    compatibleDesc: "서로의 감정을 존중하고 잘하는 점을 발견하며 응원해 줄 수 있어."
  },

  INFP: {
    pokemon: "세레비",
    emoji: "🌿",
    reason: "상상력이 풍부하고 자신만의 소중한 가치를 중요하게 여기는 INFP!\n세레비처럼 자연을 아끼고 희망적인 분위기를 가진 모습이 잘 어울려.",
    compatible: "ENFJ",
    compatibleDesc: "서로의 꿈을 격려하고 마음을 이해하며 함께 성장할 수 있어."
  },

  INTP: {
    pokemon: "폴리곤",
    emoji: "💻",
    reason: "새로운 원리와 지식을 탐구하는 것을 좋아하는 INTP!\n폴리곤처럼 독특하고 기술적인 이미지가 호기심 많은 성향과 잘 어울려.",
    compatible: "ENTJ",
    compatibleDesc: "분석적인 아이디어를 구체적인 계획으로 발전시키는 데 서로 도움을 줄 수 있어."
  },

  ESTP: {
    pokemon: "갸라도스",
    emoji: "🌊",
    reason: "과감하게 도전하고 상황에 빠르게 대응하는 ESTP!\n갸라도스처럼 강한 에너지와 대담한 이미지가 잘 어울려.",
    compatible: "ISFJ",
    compatibleDesc: "서로 다른 장점을 배우며 새로운 상황에도 유연하게 대처할 수 있어."
  },

  ESFP: {
    pokemon: "루차불",
    emoji: "🎭",
    reason: "활기차고 사람들과 함께하는 순간을 즐기는 ESFP!\n루차불처럼 화려한 매력과 넘치는 에너지로 분위기를 즐겁게 만들어 줘.",
    compatible: "ISFJ",
    compatibleDesc: "밝은 에너지와 세심한 배려가 만나 좋은 균형을 이룰 수 있어."
  },

  ENFP: {
    pokemon: "파치리스",
    emoji: "🐿️",

    compatible: "INFJ",
    compatibleDesc: "새로운 아이디어와 깊은 대화를 함께 나누며 서로를 이해할 수 있어."

  ENTP: {
    pokemon: "조로아크",
    emoji: "🦊",
    reason: "독창적인 발상과 재치 있는 문제 해결을 즐기는 ENTP!\n조로아크처럼 영리하고 변화무쌍한 이미지가 창의적인 면과 잘 어울려.",
    compatible: "INTJ",
    compatibleDesc: "서로의 전략과 아이디어를 발전시키며 새로운 방법을 발견할 수 있어."
  },

  ESTJ: {
    pokemon: "엠페르트",
    emoji: "👑",
    reason: "목표를 분명히 하고 책임감 있게 일을 이끄는 ESTJ!\n엠페르트처럼 당당하고 원칙을 중시하는 이미지가 잘 어울려.",
    compatible: "ISTP",
    compatibleDesc: "계획을 세우는 능력과 실전 대처 능력이 서로에게 도움이 될 수 있어."
  },

  ESFJ: {
    pokemon: "이어롭",
    emoji: "🐰",
    reason: "사람들과 잘 어울리고 주변을 챙기는 것을 중요하게 생각하는 ESFJ!\n이어롭처럼 친근하고 다정하면서도 자신만의 매력을 가진 모습이 어울려.",
    compatible: "ISFP",
    compatibleDesc: "서로를 배려하고 각자의 취향을 존중하며 편안한 관계를 만들 수 있어."
  },

  ENFJ: {
    pokemon: "메가니움",
    emoji: "🌸",
    reason: "사람들을 격려하고 함께 성장하는 데 관심이 많은 ENFJ!\n메가니움처럼 온화한 분위기로 주변에 편안함과 긍정적인 기운을 줄 수 있어.",
    compatible: "INFP",
    compatibleDesc: "서로의 감정을 존중하고 각자의 꿈을 응원하며 성장할 수 있어."
  },

  ENTJ: {
    pokemon: "레쿠쟈",
    emoji: "🐉",
    reason: "큰 목표를 세우고 적극적으로 앞으로 나아가는 ENTJ!\n레쿠쟈처럼 강렬한 존재감과 카리스마를 가진 모습이 잘 어울려.",
    compatible: "INTP",
    compatibleDesc: "추진력과 창의적인 분석을 결합해 새로운 아이디어를 발전시킬 수 있어."
  }
};

const mbtiTypes = [
  "ISTJ", "ISFJ", "INFJ", "INTJ",
  "ISTP", "ISFP", "INFP", "INTP",
  "ESTP", "ESFP", "ENFP", "ENTP",
  "ESTJ", "ESFJ", "ENFJ", "ENTJ"
];

const grid = document.getElementById("mbtiGrid");

mbtiTypes.forEach(function(type) {
  const button = document.createElement("button");

  button.type = "button";
  button.className = "mbti-btn";
  button.textContent = type;

  button.addEventListener("click", function() {
    showResult(type);
  });

  grid.appendChild(button);
});

function showResult(type) {
  const data = pokemonData[type];

  document.getElementById("typeLabel").textContent =
    "MY TYPE  ·  " + type;

  document.getElementById("pokemonEmoji").textContent =
    data.emoji;

  document.getElementById("pokemonName").textContent =
    data.pokemon;

  document.getElementById("pokemonDesc").textContent =
    data.reason;

  document.getElementById("compatibleType").textContent =
    data.compatible;

  document.getElementById("compatibleDesc").textContent =
    data.compatibleDesc;

  const result = document.getElementById("result");
  result.style.display = "block";

  result.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function resetPage() {
  document.getElementById("result").style.display = "none";

  document.getElementById("mbtiGrid").scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}
</script>

</body>
</html>
